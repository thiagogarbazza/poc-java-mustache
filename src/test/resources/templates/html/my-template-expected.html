<!DOCTYPE html>
<html lang="en" id="eb526806-fe9e-4500-8327-f1f8995ae3c1" date-time="12/05/2026 19:33:56">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Example of html template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th, .table td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    .table th {
      background-color: #f2f2f2;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="content">
  <div class="header">
    <h1>Welcome to my website</h1>
    <p>This is a subtitle</p>
  </div>

  <div class="table-responsive">
    <table class="table">
      <thead>
      <tr>
        <th>Document</th>
        <th>Status</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td>AB12</td>
        <td>Pending</td>
      </tr>
      <tr>
        <td>CD34</td>
        <td>Completed</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    <p>2026 - My company. All rights reserved.</p>
    <p>123 Main Street, Anytown, USA</p>
  </div>

</div>
</body>
</html>
